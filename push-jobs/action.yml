name: Mergelight push jobs
description: Pushes what Mergelight's jobs changed as one commit to the pull request's branch. Runs no AI and holds no AI login.
author: Mergelight
branding:
  icon: git-commit
  color: green

# Use it in a workflow job of its own, after the job that runs Mergelight's jobs, with only
# "contents: write" and "pull-requests: read" (it reads the pull request first, which a private
# repository allows only with that). It installs no AI and is given no AI login. It trusts nothing in the result file:
# it reads the jobs again from the base branch, checks every changed file against them, and makes one
# commit that GitHub refuses if the branch moved on since. It never force-pushes.

inputs:
  result:
    description: The file the jobs step wrote (mergelight-jobs.json), downloaded from that step's artifact.
    required: true
  github-token:
    description: >
      A token that can push to the pull request's branch and read the pull request. The workflow's own
      token with "contents: write" and "pull-requests: read" is enough. A push made with it starts the
      repository's other pull_request workflows only after a person with write access approves them
      in the pull request ("Approve workflows to run"). GitHub's docs, "Triggering a workflow", say so,
      and a test pull request showed it. Workflows that run only on push don't start for its commit at
      all, so a check they give, if your branch rules require it, never comes. To have them run, pass
      a GitHub App's token, or a personal one, that can push to the branch.
    default: ${{ github.token }}

outputs:
  pushed:
    description: '"true" when a commit was pushed.'
    value: ${{ steps.push.outputs.pushed }}
  commit:
    description: The commit that was pushed.
    value: ${{ steps.push.outputs.commit }}
  why:
    description: Why nothing was pushed, when that's the case.
    value: ${{ steps.push.outputs.why }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 22

    - name: Build Mergelight
      shell: bash
      working-directory: ${{ github.action_path }}/../packages/mergelight
      run: npm ci --no-audit --no-fund --loglevel=error && npm run build --silent

    - name: Push the jobs' commit
      id: push
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        RESULT: ${{ inputs.result }}
      run: node "$GITHUB_ACTION_PATH/../packages/mergelight/dist/cli.js" push-jobs "$GITHUB_REPOSITORY#$PR" --from "$RESULT"
