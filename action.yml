name: Mergelight
description: AI code review on the Claude or ChatGPT plan you already pay for. Tells you which problems are worth fixing.
author: Mergelight
branding:
  icon: git-merge
  color: green

inputs:
  codex-auth-json:
    description: >
      A ChatGPT login, saved as a secret. Leave the secret unset and the first pull request shows a
      link and code to connect ChatGPT, then saves it.
    required: false
  openai-api-key:
    description: An OpenAI API key, billed per use.
    required: false
  claude-code-oauth-token:
    description: A Claude plan's login, from "claude setup-token" on your computer, saved as a secret.
    required: false
  anthropic-api-key:
    description: An Anthropic API key, billed per use. A Claude plan's login is used first if both are set.
    required: false
  provider:
    description: >
      Who reviews: claude or codex. A value here always wins. Leave it empty and a repository with only
      a Claude login uses Claude, and every other repository uses Codex.
    required: false
  secrets-token:
    description: >
      Only needed without the Mergelight AI app. A token that can update this repository's secrets
      (fine-grained, "Secrets: read and write"). A ChatGPT login's token lasts 10 days, and each
      refreshed login has to be saved back to the secret. The app does this on its own.
    required: false
  auth-secret-name:
    description: Name of the secret that holds the ChatGPT login.
    default: CODEX_AUTH_JSON
  model:
    description: Model to review with. Defaults to Codex's own default, or opus on Claude.
    required: false
  effort:
    description: "Reasoning effort: low, medium or high."
    required: false
  verify-with:
    description: >
      Who checks the findings: claude or codex. A value here always wins. Leave it empty and, when both
      AIs have a login, the one that doesn't review checks, so two AIs look at every finding; otherwise
      the reviewer checks its own. When the checker has no login yet, a pull request from this
      repository asks to connect it, the same way as the reviewer's login. If nobody does within 15
      minutes, or it can't be asked here, the reviewer checks and the summary says so.
    required: false
  yellow-blocks:
    description: 'Set to "true" for a team that wants the check to hold merges: a "needs a human" check then waits for an approval, and a "blocked" one fails until the code changes. Off, both end neutral. The same goes for your team''s own checks from the dashboard: on, one that failed, couldn''t tell or couldn''t run holds the merge, and off, it ends neutral. Leave it off if you work alone, since GitHub bars approving your own PR.'
    default: "false"
  auto-approve:
    description: >
      When a review is green and every one of your team's own checks passed, Mergelight approves the
      pull request, like a reviewer would, and takes the approval back when a later review isn't
      green. Set to "false" to turn that off: Mergelight then never approves, and takes back an
      approval it gave before on each pull request's next review. For pull requests that are already
      open, dismiss Mergelight's approval by hand or push to them. Where a branch rule asks for an
      approval, a person then has to give it. Any other value than true or false, empty aside, counts as false.
    default: "true"
  codex-version:
    description: Version of the Codex CLI to install.
    default: "0.166.0"
  claude-code-version:
    description: Version of the Claude Code CLI to install.
    default: "2.1.319"
  github-token:
    description: Token for posting comments and checks. Needs pull-requests and checks write.
    default: ${{ github.token }}
  token-server:
    description: >
      Where to get a Mergelight AI app token, so comments and checks carry the app's name and logo.
      Needs the app installed and "id-token: write". Without them, or with this empty, the run posts
      as github-actions[bot].
    default: https://api.mergelight.dev/token
  server:
    description: >
      Address of a Mergelight server, for teams that use the dashboard: reviews in one place, memory
      of what your team declined, rules for every review, your team's own skills and its own checks. Empty means off, and then
      nothing about a review leaves your runner. With it, each run first shows the server GitHub's
      signed token, which names the repository, branch, workflow and who started the run. If your
      org turned the dashboard on, the run then sends the review's numbers (how many findings, the
      light, how long it took) and the findings your team declined on that pull request: each one's
      title, file and lines, the reason the person gave, and who declined it and when, so later
      reviews leave it out. Never code, never
      other findings, and never your AI login. Needs "id-token: write".
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 22

    - name: Build Mergelight
      shell: bash
      working-directory: ${{ github.action_path }}/packages/mergelight
      run: npm ci --no-audit --no-fund --loglevel=error && npm run build --silent

    # GitHub's OIDC token proves which repository this run belongs to, and the token server swaps
    # it for an app token limited to that repository. Skipped when you pass your own github-token.
    - name: Get the Mergelight AI app token
      id: app
      if: >
        inputs.github-token == github.token &&
        (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' ||
        (github.event_name == 'pull_request_review' && github.event.review.state == 'approved'))
      shell: bash
      env:
        TOKEN_SERVER: ${{ inputs.token-server }}
      run: node "$GITHUB_ACTION_PATH/packages/mergelight/scripts/app-token.mjs"

    # A human approved the PR: turn a "needs a human" check green. No Codex needed.
    - name: Approve the check
      if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token || inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        BY: ${{ github.event.review.user.login }}
        # The commit the person looked at. An approval of an older commit doesn't cover what was pushed after it.
        COMMIT: ${{ github.event.review.commit_id }}
      run: node "$GITHUB_ACTION_PATH/packages/mergelight/dist/cli.js" approve "$GITHUB_REPOSITORY#$PR" --by "$BY" --at "$COMMIT"

    - name: Choose who reviews and who checks
      if: github.event_name != 'pull_request_review'
      shell: bash
      env:
        WANTED: ${{ inputs.provider }}
        WANTED_CHECKER: ${{ inputs.verify-with }}
        HAS_CLAUDE: ${{ (inputs.claude-code-oauth-token != '' || inputs.anthropic-api-key != '') && '1' || '' }}
        HAS_CODEX: ${{ (inputs.codex-auth-json != '' || inputs.openai-api-key != '') && '1' || '' }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        VISIBILITY: ${{ github.event.repository.visibility }}
        SECRET_NAME: ${{ inputs.auth-secret-name }}
      run: |
        provider="$WANTED"
        if [ -z "$provider" ]; then
          if [ -n "$HAS_CLAUDE" ] && [ -z "$HAS_CODEX" ]; then provider=claude; else provider=codex; fi
        fi
        if [ "$provider" != claude ] && [ "$provider" != codex ]; then
          echo "::error::provider must be claude or codex, not \"$provider\"."
          exit 1
        fi
        # Only a pull request from this repository may ask for a login: forks and Dependabot get no
        # secrets, so nothing could be saved for them, and a stranger must never start a sign-in.
        can_ask=""
        if { [ "$GITHUB_EVENT_NAME" = pull_request ] || [ "$GITHUB_EVENT_NAME" = pull_request_target ]; } &&
          { [ -z "${HEAD_REPO:-}" ] || [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; } && [ "$GITHUB_ACTOR" != "dependabot[bot]" ]; then
          can_ask=1
        fi
        # provider: claude with no Claude login yet, as the setup page writes when a ChatGPT repository
        # picks Claude: the pull request asks to connect Claude, as a missing ChatGPT login does for Codex.
        connect_claude=0
        no_login=0
        if [ "$provider" = claude ] && [ -z "$HAS_CLAUDE" ]; then
          if [ -n "$can_ask" ]; then
            connect_claude=1
          else
            echo "::notice::Skipping the review: the provider is claude, but this run has no Claude login and can't ask for one."
            no_login=1
          fi
        fi
        # Who checks: with a login for both AIs, the one that doesn't review, so two AIs look at every
        # finding. Otherwise the reviewer checks its own findings.
        checker="$WANTED_CHECKER"
        if [ -z "$checker" ]; then
          if [ -n "$HAS_CLAUDE" ] && [ -n "$HAS_CODEX" ]; then
            if [ "$provider" = claude ]; then checker=codex; else checker=claude; fi
          else
            checker="$provider"
          fi
        fi
        if [ "$checker" != claude ] && [ "$checker" != codex ]; then
          echo "::error::verify-with must be claude or codex, not \"$checker\"."
          exit 1
        fi
        # A checker with no login yet is connected from a pull request of this repository, the same way as
        # the reviewer's login. Forks and Dependabot get no secrets, so nothing could be saved for them.
        # One sign-in per run: a Codex reviewer with no login connects first, and the checker comes later.
        # Without it, the reviewer checks, and the review's summary says so.
        connect_check=""
        checker_has=1
        if [ "$checker" != "$provider" ]; then
          if [ "$checker" = claude ]; then checker_has="$HAS_CLAUDE"; else checker_has="$HAS_CODEX"; fi
          if [ "$provider" = claude ]; then reviewer_has="$HAS_CLAUDE"; else reviewer_has="$HAS_CODEX"; fi
          if [ -z "$checker_has" ] && [ -n "$can_ask" ] && [ -n "$reviewer_has" ]; then
            if [ "$checker" = codex ] && [ "${VISIBILITY:-}" != private ]; then
              # Anyone who can see the pull request could enter a ChatGPT code shown there, and pick whose
              # account checks: only a private repository shows one, and one that can't be told doesn't.
              # Claude's link instead goes through mergelight.dev, where you sign in.
              echo "::notice::Codex is set to check, but only a private repository shows a ChatGPT code, as anyone who can see the pull request could enter it. Save a ChatGPT login as the ${SECRET_NAME:-CODEX_AUTH_JSON} secret yourself: run codex login, then gh secret set ${SECRET_NAME:-CODEX_AUTH_JSON} --repo $GITHUB_REPOSITORY < ~/.codex/auth.json. This review is checked by $provider."
            elif [ "$checker" = codex ] && [ -z "$WANTED" ]; then
              # Claude reviews only because it has the one login: with a ChatGPT login saved too, the next
              # run would pick Codex to review. So the sign-in waits for the workflow to say who reviews.
              echo "::notice::Codex is set to check, but connecting ChatGPT would make Codex review from the next run on. Set provider: claude in the workflow to keep Claude reviewing, then push. This review is checked by Claude."
            else
              connect_check="$checker"
            fi
          fi
        fi
        # Left empty, a checker that is the reviewer stays the reviewer: connecting Claude in place of
        # ChatGPT further on makes Claude review, and then Claude checks too.
        follows=0
        if [ -z "$WANTED_CHECKER" ] && [ "$checker" = "$provider" ]; then follows=1; fi
        # A checker is set up only when it can check: it has a login, or one is asked for now. Otherwise
        # the reviewer checks, and nothing that could fail is installed for it.
        checker_used=""
        if [ -n "$checker_has" ] || [ -n "$connect_check" ]; then checker_used="$checker"; fi
        uses_codex=0
        if [ "$provider" = codex ] || [ "$checker_used" = codex ]; then uses_codex=1; fi
        uses_claude=0
        if [ "$provider" = claude ] || [ "$checker_used" = claude ]; then uses_claude=1; fi
        # A job can run this Action more than once, so nothing carries over from an earlier run.
        {
          echo "MERGELIGHT_PROVIDER=$provider"
          echo "MERGELIGHT_VERIFY=$checker"
          echo "MERGELIGHT_VERIFY_FOLLOWS=$follows"
          echo "MERGELIGHT_CONNECT_CHECK=$connect_check"
          echo "MERGELIGHT_CONNECT_CLAUDE=$connect_claude"
          echo "MERGELIGHT_USES_CODEX=$uses_codex"
          echo "MERGELIGHT_USES_CLAUDE=$uses_claude"
          echo "MERGELIGHT_CHECKER_NOT_INSTALLED=0"
          echo "MERGELIGHT_CHECKER_LOGIN_FAILED=0"
          echo "MERGELIGHT_CHECK_RUN="
          echo "MERGELIGHT_PROMPT="
          echo "MERGELIGHT_CHATGPT=0"
          echo "MERGELIGHT_CONNECT=0"
          echo "MERGELIGHT_NO_LOGIN=$no_login"
          echo "MERGELIGHT_LOGIN_LOST=0"
        } >> "$GITHUB_ENV"

    - name: Install Claude Code
      if: github.event_name != 'pull_request_review' && env.MERGELIGHT_USES_CLAUDE == '1'
      shell: bash
      run: |
        npm install -g "@anthropic-ai/claude-code@${{ inputs.claude-code-version }}" --no-audit --no-fund --loglevel=error && exit 0
        # Claude only checking: the reviewer checks instead, and the review goes on.
        if [ "$MERGELIGHT_PROVIDER" != claude ]; then
          echo "::warning::Couldn't install Claude Code, so $MERGELIGHT_PROVIDER checks this review."
          { echo "MERGELIGHT_USES_CLAUDE=0"; echo "MERGELIGHT_CHECKER_NOT_INSTALLED=1"; [ "${MERGELIGHT_CONNECT_CHECK:-}" != claude ] || echo "MERGELIGHT_CONNECT_CHECK="; } >> "$GITHUB_ENV"
          exit 0
        fi
        exit 1

    - name: Install Codex
      if: github.event_name != 'pull_request_review' && env.MERGELIGHT_USES_CODEX == '1'
      shell: bash
      run: |
        npm install -g "@openai/codex@${{ inputs.codex-version }}" --no-audit --no-fund --loglevel=error && exit 0
        # Codex only checking: the reviewer checks instead, and the review goes on.
        if [ "$MERGELIGHT_PROVIDER" != codex ]; then
          echo "::warning::Couldn't install Codex, so $MERGELIGHT_PROVIDER checks this review."
          { echo "MERGELIGHT_USES_CODEX=0"; echo "MERGELIGHT_CHECKER_NOT_INSTALLED=1"; [ "${MERGELIGHT_CONNECT_CHECK:-}" != codex ] || echo "MERGELIGHT_CONNECT_CHECK="; } >> "$GITHUB_ENV"
          exit 0
        fi
        exit 1

    # Codex's Linux sandbox (bubblewrap) needs unprivileged user namespaces, which Ubuntu 24.04
    # runners block through AppArmor. Without them Codex can't read the code. Same fix as
    # OpenAI's codex-action (PR #77). Self-hosted runners need this configured ahead of time.
    - name: Let the Codex sandbox start
      if: github.event_name != 'pull_request_review' && env.MERGELIGHT_USES_CODEX == '1' && runner.os == 'Linux'
      shell: bash
      run: |
        userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
        if [ -n "$userns" ] && [ "$userns" != "1" ]; then
          sudo -n sysctl -w kernel.unprivileged_userns_clone=1 || echo "::warning::Couldn't enable unprivileged user namespaces; Codex may not be able to read the code."
        fi
        apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
        if [ -n "$apparmor" ] && [ "$apparmor" != "0" ]; then
          sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "::warning::Couldn't lift the AppArmor user namespace limit; Codex may not be able to read the code."
        fi

    - name: Log in to Codex
      if: github.event_name != 'pull_request_review' && env.MERGELIGHT_USES_CODEX == '1'
      shell: bash
      env:
        AUTH_JSON: ${{ inputs.codex-auth-json }}
        API_KEY: ${{ inputs.openai-api-key }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        set -euo pipefail
        export CODEX_HOME="$RUNNER_TEMP/codex-home"
        mkdir -p -m 700 "$CODEX_HOME"
        echo "CODEX_HOME=$CODEX_HOME" >> "$GITHUB_ENV"
        # A job can run this Action more than once, so nothing carries over from an earlier run. The choice
        # step already set MERGELIGHT_NO_LOGIN, which a Claude reviewer with no login keeps here.
        {
          echo "MERGELIGHT_CHATGPT=0"
          echo "MERGELIGHT_CONNECT=0"
          echo "MERGELIGHT_LOGIN_LOST=0"
        } >> "$GITHUB_ENV"
        if [ -n "$AUTH_JSON" ]; then
          printf 'cli_auth_credentials_store = "file"\n' > "$CODEX_HOME/config.toml"
          printf '%s' "$AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          sha256sum "$CODEX_HOME/auth.json" | cut -d' ' -f1 > "$RUNNER_TEMP/codex-auth.sha256"
          echo "MERGELIGHT_CHATGPT=1" >> "$GITHUB_ENV"
        elif [ -n "$API_KEY" ]; then
          if ! printf '%s' "$API_KEY" | codex login --with-api-key; then
            # Codex only checking: the reviewer checks instead, and the review goes on.
            if [ "${MERGELIGHT_PROVIDER:-codex}" != codex ]; then
              echo "::warning::Codex couldn't log in with the OpenAI API key, so $MERGELIGHT_PROVIDER checks this review."
              { echo "MERGELIGHT_USES_CODEX=0"; echo "MERGELIGHT_CHECKER_LOGIN_FAILED=1"; } >> "$GITHUB_ENV"
            else
              exit 1
            fi
          fi
        elif [ "${MERGELIGHT_PROVIDER:-codex}" != codex ]; then
          # Codex only checks. Without a login it is connected further on when it can be, and otherwise
          # the reviewer checks: the review itself goes ahead either way.
          if [ "${MERGELIGHT_CONNECT_CHECK:-}" = codex ]; then printf 'cli_auth_credentials_store = "file"\n' > "$CODEX_HOME/config.toml"; fi
          echo "No Codex login yet, so it can't check the review on this run unless it's connected now."
        elif [ "$GITHUB_ACTOR" = "dependabot[bot]" ]; then
          # GitHub keeps repository secrets from Dependabot's runs, so a login can't be read or saved here.
          echo "::notice::Skipping the review: GitHub gives Dependabot's runs no secrets."
          echo "MERGELIGHT_NO_LOGIN=1" >> "$GITHUB_ENV"
        elif [ -n "${HEAD_REPO:-}" ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
          # A fork's runs get no secrets either, and a stranger's pull request must never start a sign-in.
          echo "::notice::Skipping the review: GitHub gives pull requests from forks no secrets."
          echo "MERGELIGHT_NO_LOGIN=1" >> "$GITHUB_ENV"
        elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; then
          # No login yet: the next step connects ChatGPT from the pull request.
          printf 'cli_auth_credentials_store = "file"\n' > "$CODEX_HOME/config.toml"
          echo "MERGELIGHT_CONNECT=1" >> "$GITHUB_ENV"
        else
          echo "No Codex login yet, so there's nothing to keep fresh."
          echo "MERGELIGHT_NO_LOGIN=1" >> "$GITHUB_ENV"
        fi

    - name: Hide the Codex login in the logs
      if: env.MERGELIGHT_CHATGPT == '1'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/packages/mergelight/scripts/mask-login.mjs"

    # Refresh before anything uses the login, and save at once, so a review never does it halfway
    # through while another starts from the old login. The job always refreshes. A review only does
    # when its token could run out during it.
    - name: Refresh the Codex login if it's due
      if: >
        env.MERGELIGHT_CHATGPT == '1' &&
        (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' ||
        github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      shell: bash
      env:
        SECRETS_TOKEN: ${{ inputs.secrets-token }}
        SECRET_NAME: ${{ inputs.auth-secret-name }}
        TOKEN_SERVER: ${{ inputs.token-server }}
      run: node "$GITHUB_ACTION_PATH/packages/mergelight/scripts/refresh-login.mjs"

    # A login needs somewhere to be saved: the app with Secrets write approved, or a token that can
    # update secrets. Find out before asking anyone to enter a code. Being able to post isn't enough.
    - name: Check the login can be saved
      id: saving
      if: env.MERGELIGHT_CONNECT == '1' || env.MERGELIGHT_CONNECT_CLAUDE == '1' || env.MERGELIGHT_CONNECT_CHECK != ''
      shell: bash
      env:
        SECRETS_TOKEN: ${{ inputs.secrets-token }}
        TOKEN_SERVER: ${{ inputs.token-server }}
      run: |
        if [ -z "$SECRETS_TOKEN" ]; then
          out="$RUNNER_TEMP/mergelight-login-check"
          : > "$out"
          TOKEN_SCOPE=login GITHUB_OUTPUT="$out" node "$GITHUB_ACTION_PATH/packages/mergelight/scripts/app-token.mjs"
          saved="$(grep -c '^token=' "$out" || true)"
          rm -f "$out"
          [ "$saved" != "0" ] || exit 0
        fi
        echo "can_save=true" >> "$GITHUB_OUTPUT"

    # Offered beside ChatGPT, so someone on a Claude plan can connect without a terminal.
    - name: Install Claude Code for the sign-in
      if: env.MERGELIGHT_CONNECT == '1'
      shell: bash
      run: npm install -g "@anthropic-ai/claude-code@${{ inputs.claude-code-version }}" --no-audit --no-fund --loglevel=error || echo "::warning::Couldn't install Claude Code, so only ChatGPT is offered."

    - name: Connect ChatGPT
      if: env.MERGELIGHT_CONNECT == '1'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token || inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        GITHUB_WORKFLOW_TOKEN: ${{ inputs.github-token }}
        CAN_SAVE: ${{ steps.saving.outputs.can_save }}
        SECRET_NAME: ${{ inputs.auth-secret-name }}
      run: |
        args=(connect "$GITHUB_REPOSITORY#$PR")
        [ "$CAN_SAVE" = "true" ] || args+=(--no-save)
        node "$GITHUB_ACTION_PATH/packages/mergelight/dist/cli.js" "${args[@]}"

    # provider: claude with no Claude login yet: only Claude's link is offered, the one the setup page
    # answers. Like a missing ChatGPT login, a sign-in that doesn't finish ends the run.
    - name: Connect Claude
      if: env.MERGELIGHT_CONNECT_CLAUDE == '1'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token || inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        GITHUB_WORKFLOW_TOKEN: ${{ inputs.github-token }}
        CAN_SAVE: ${{ steps.saving.outputs.can_save }}
      run: |
        args=(connect "$GITHUB_REPOSITORY#$PR" --ai claude)
        [ "$CAN_SAVE" = "true" ] || args+=(--no-save)
        node "$GITHUB_ACTION_PATH/packages/mergelight/dist/cli.js" "${args[@]}"

    # The AI that checks the review, when it has no login yet. Nobody connecting it holds nothing up:
    # the review starts when the code runs out, checked by the reviewer, and its summary says so.
    - name: Connect the checker
      if: env.MERGELIGHT_CONNECT_CHECK != ''
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token || inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        GITHUB_WORKFLOW_TOKEN: ${{ inputs.github-token }}
        CAN_SAVE: ${{ steps.saving.outputs.can_save }}
        SECRET_NAME: ${{ inputs.auth-secret-name }}
      run: |
        args=(connect "$GITHUB_REPOSITORY#$PR" --for check --ai "$MERGELIGHT_CONNECT_CHECK" --reviewer "$MERGELIGHT_PROVIDER")
        [ "$CAN_SAVE" = "true" ] || args+=(--no-save)
        node "$GITHUB_ACTION_PATH/packages/mergelight/dist/cli.js" "${args[@]}" || echo "::warning::Connecting the checker didn't finish, so the reviewer checks this time."

    # The sign-in for the checker can take 15 minutes, which a Codex reviewer's login may not have left.
    - name: Refresh the Codex login again after the sign-in
      if: env.MERGELIGHT_CHATGPT == '1' && env.MERGELIGHT_CONNECT_CHECK != ''
      shell: bash
      env:
        SECRETS_TOKEN: ${{ inputs.secrets-token }}
        SECRET_NAME: ${{ inputs.auth-secret-name }}
        TOKEN_SERVER: ${{ inputs.token-server }}
      run: node "$GITHUB_ACTION_PATH/packages/mergelight/scripts/refresh-login.mjs"

    - name: Hide the new Codex login in the logs
      if: env.MERGELIGHT_CONNECT == '1' || env.MERGELIGHT_CONNECT_CHECK == 'codex'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/packages/mergelight/scripts/mask-login.mjs"

    # Saved right away, so a pull request opened during this review doesn't ask for another code.
    - name: Save the new Codex login
      if: env.MERGELIGHT_CONNECT == '1' || env.MERGELIGHT_CONNECT_CHECK == 'codex'
      shell: bash
      env:
        SECRETS_TOKEN: ${{ inputs.secrets-token }}
        SECRET_NAME: ${{ inputs.auth-secret-name }}
        TOKEN_SERVER: ${{ inputs.token-server }}
      run: |
        bash "$GITHUB_ACTION_PATH/packages/mergelight/scripts/save-login.sh" && exit 0
        # A checker's login that can't be saved doesn't stop a review whose reviewer has a login. The run's
        # last step tries to save it again.
        if [ "${MERGELIGHT_CONNECT:-0}" != 1 ] && [ "${MERGELIGHT_CONNECT_CHECK:-}" = codex ]; then
          echo "::warning::The new ChatGPT login couldn't be saved yet. This review goes on, and the run tries again when it ends."
          exit 0
        fi
        exit 1

    - name: Save the new Claude login
      if: env.MERGELIGHT_CLAUDE_TOKEN != ''
      shell: bash
      env:
        SECRETS_TOKEN: ${{ inputs.secrets-token }}
        TOKEN_SERVER: ${{ inputs.token-server }}
      run: |
        bash "$GITHUB_ACTION_PATH/packages/mergelight/scripts/save-claude-login.sh" && exit 0
        # A checker's login that can't be saved doesn't stop the review: this run still checks with it.
        if [ "${MERGELIGHT_CONNECT_CHECK:-}" = claude ]; then
          echo "::warning::The new Claude login couldn't be saved, so the next run asks for it again. This review goes on."
          exit 0
        fi
        exit 1

    - name: Review
      id: review
      if: (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && env.MERGELIGHT_NO_LOGIN != '1'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token || inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        YELLOW_BLOCKS: ${{ inputs.yellow-blocks }}
        AUTO_APPROVE: ${{ inputs.auto-approve }}
        MERGELIGHT_ACTION_REF: ${{ github.action_ref }}
        MERGELIGHT_SERVER: ${{ inputs.server }}
        SECRET_NAME: ${{ inputs.auth-secret-name }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token || env.MERGELIGHT_CLAUDE_TOKEN }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        set -euo pipefail
        # The checker needs a login that works now. Without one, the reviewer checks, and the summary says so.
        verify="${MERGELIGHT_VERIFY:-$MERGELIGHT_PROVIDER}"
        if [ "${MERGELIGHT_VERIFY_FOLLOWS:-0}" = 1 ]; then verify="$MERGELIGHT_PROVIDER"; fi
        missed=""
        if [ "$verify" != "$MERGELIGHT_PROVIDER" ]; then
          # Only a login this Action set up counts: never one the runner itself happens to have.
          if [ "$verify" = claude ]; then
            { [ "${MERGELIGHT_USES_CLAUDE:-0}" = 1 ] && [ -n "$CLAUDE_CODE_OAUTH_TOKEN$ANTHROPIC_API_KEY" ]; } || missed=claude
          elif [ "${MERGELIGHT_USES_CODEX:-0}" != 1 ] || [ "${MERGELIGHT_LOGIN_LOST:-0}" = 1 ] || ! codex login status > /dev/null 2>&1; then
            missed=codex
          fi
        fi
        if [ -n "$missed" ]; then
          echo "::notice::$missed has no login yet, so $MERGELIGHT_PROVIDER checks this review."
          verify="$MERGELIGHT_PROVIDER"
        fi
        args=(review "$GITHUB_REPOSITORY#$PR" --post --provider "$MERGELIGHT_PROVIDER" --verify-with "$verify" --out "$RUNNER_TEMP/mergelight-review.json")
        [ -n "$missed" ] && args+=(--verify-missed "$missed")
        [ -n "$missed" ] && [ "${MERGELIGHT_CHECKER_NOT_INSTALLED:-0}" = 1 ] && args+=(--verify-missed-why not-installed)
        # A saved ChatGPT login that couldn't be refreshed or read is one that stopped working, not one never connected.
        [ "$missed" = codex ] && [ "${MERGELIGHT_CHECKER_NOT_INSTALLED:-0}" != 1 ] && { [ "${MERGELIGHT_LOGIN_LOST:-0}" = 1 ] || [ "${MERGELIGHT_CHATGPT:-0}" = 1 ] || [ "${MERGELIGHT_CHECKER_LOGIN_FAILED:-0}" = 1 ]; } && args+=(--verify-missed-why login-failed)
        [ -n "$MODEL" ] && args+=(--model "$MODEL")
        [ -n "$EFFORT" ] && args+=(--effort "$EFFORT")
        [ "$YELLOW_BLOCKS" = "true" ] && args+=(--yellow-blocks)
        # Only a value that clearly means on keeps approvals on. A typo turns them off and says so:
        # an approval nobody wanted is worse than one a person has to give.
        case "$(printf '%s' "$AUTO_APPROVE" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')" in
          true|yes|on|1|"") ;;
          false|no|off|0) args+=(--no-approve) ;;
          *) echo "::warning::auto-approve is \"$AUTO_APPROVE\", which isn't true or false, so Mergelight won't approve." ; args+=(--no-approve) ;;
        esac
        node "$GITHUB_ACTION_PATH/packages/mergelight/dist/cli.js" "${args[@]}"

    # The check that stands for this run: a connect's, until the review takes over with its own. Whatever
    # is still running when the run ends, as when the review never started or the run was cancelled, is
    # finished here, so it doesn't wait for ever. A finished one is left as it is.
    - name: Finish a check left running
      if: always() && github.event_name != 'pull_request_review' && env.MERGELIGHT_CHECK_RUN != ''
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token || inputs.github-token }}
      run: |
        # Only a check known to be still running: a finished verdict stands, and one that can't be read is left.
        status="$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$MERGELIGHT_CHECK_RUN" --jq .status 2>/dev/null || echo unknown)"
        if [ "$status" != in_progress ] && [ "$status" != queued ]; then exit 0; fi
        # Cancelled, not neutral: no review ran and no approval was taken back, so the check must not pass
        # next to an approval Mergelight gave an older commit.
        gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$MERGELIGHT_CHECK_RUN" \
          -f status=completed -f conclusion=cancelled \
          -f "output[title]=Couldn't review this pull request: the run stopped first" \
          -f "output[summary]=A step before the review failed, or the run was cancelled. The workflow log has the details. Push a commit, or run it again, to review." > /dev/null \
          || echo "::warning::Couldn't finish the Mergelight check."

    # Codex may have refreshed the login during the run. Save the new one, or the next run
    # starts from tokens that no longer work. An API key's login is never saved over a ChatGPT one.
    - name: Save the refreshed Codex login
      if: always() && github.event_name != 'pull_request_review' && (env.MERGELIGHT_CHATGPT == '1' || env.MERGELIGHT_CONNECT == '1' || env.MERGELIGHT_CONNECT_CHECK == 'codex')
      shell: bash
      env:
        SECRETS_TOKEN: ${{ inputs.secrets-token }}
        SECRET_NAME: ${{ inputs.auth-secret-name }}
        TOKEN_SERVER: ${{ inputs.token-server }}
      run: bash "$GITHUB_ACTION_PATH/packages/mergelight/scripts/save-login.sh"

    - name: Clean up the Codex login
      if: always() && github.event_name != 'pull_request_review'
      shell: bash
      run: rm -rf "$RUNNER_TEMP/codex-home" "$RUNNER_TEMP/codex-auth.sha256"
