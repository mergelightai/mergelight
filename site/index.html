<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mergelight: AI code review on the plan you already pay for</title>
<meta name="description" content="Mergelight reviews every pull request with your own Claude or ChatGPT subscription. No per-review bill. Open source, launching soon.">
<meta name="theme-color" content="#f5f6f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e0f" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mergelight.dev">
<meta property="og:title" content="Mergelight">
<meta property="og:description" content="AI code review on the Claude or ChatGPT plan you already pay for.">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:image" content="https://mergelight.dev/icon-192.png">
<link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Geist";
    src: url("/fonts/Geist-Variable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }

  :root {
    color-scheme: light dark;
    --bg: #f5f6f6;
    --text: #141718;
    --muted: #596064;
    --line: #dfe2e3;
    --rail: #c5cacc;
    --branch: #8a9196;
    --accent: #137a41;
    --accent-hover: #0f6a38;
    --accent-ink: #f4faf6;
    --glow: #22aa5c;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0e0f;
      --text: #e9ecec;
      --muted: #9aa2a6;
      --line: #202528;
      --rail: #353b3f;
      --branch: #6f777c;
      --accent: #3fcb78;
      --accent-hover: #5ad68c;
      --accent-ink: #06210f;
      --glow: #3fcb78;
    }
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .page {
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px;
  }

  header {
    height: 72px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  header img { width: 32px; height: 32px; flex: none; display: block; }

  main {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    align-items: center;
    gap: 56px;
    padding: 24px 0 64px;
  }

  h1 {
    margin: 0;
    font-size: clamp(2.4rem, 4.6vw, 3.6rem);
    line-height: 1.04;
    letter-spacing: -0.035em;
    font-weight: 600;
    text-wrap: balance;
  }

  .lede {
    margin: 22px 0 0;
    max-width: 44ch;
    font-size: 1.125rem;
    line-height: 1.6;
    color: var(--muted);
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 34px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    height: 44px;
    padding: 0 20px;
    border-radius: 999px;
    font: inherit;
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
    text-decoration: none;
    transition: transform .2s cubic-bezier(.16, 1, .3, 1), background-color .2s, border-color .2s;
  }

  .btn:active { transform: translateY(1px) scale(.98); }

  .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .btn-primary:hover { background: var(--accent-hover); }

  .btn-secondary {
    border: 1px solid var(--rail);
    color: var(--text);
  }

  .btn-secondary:hover { border-color: var(--branch); }

  .visual {
    width: 100%;
    max-width: 400px;
    justify-self: end;
  }

  .visual img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 22.37%;
    box-shadow: 0 28px 70px -28px rgb(30 15 70 / .55);
  }

  footer {
    height: 64px;
    display: flex;
    align-items: center;
    border-top: 1px solid var(--line);
    font-size: 14px;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: no-preference) {
    .copy > * {
      animation: rise .7s cubic-bezier(.16, 1, .3, 1) both;
    }
    .copy > :nth-child(2) { animation-delay: .08s; }
    .copy > :nth-child(3) { animation-delay: .16s; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }

  @media (max-width: 820px) {
    .page { padding: 0 20px; }
    header { height: 64px; }
    main {
      grid-template-columns: 1fr;
      gap: 40px;
      padding: 32px 0 48px;
    }
    .visual { justify-self: start; max-width: 280px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <img src="/logo.png" width="32" height="32" alt="">
    <span>Mergelight</span>
  </header>

  <main>
    <div class="copy">
      <h1>AI code review on the plan you already pay for.</h1>
      <p class="lede">Mergelight reviews every pull request with your own Claude or ChatGPT subscription. No per-review bill. Open source, launching soon.</p>
      <div class="actions">
        <a class="btn btn-primary" href="https://github.com/mergelightai/mergelight">Watch on GitHub</a>
        <a class="btn btn-secondary" href="mailto:hello@mergelight.dev">Email us</a>
      </div>
    </div>

    <div class="visual">
      <img src="/logo-animated.svg" width="400" height="400" alt="">
    </div>
  </main>

  <footer>&copy; 2026 Mergelight</footer>
</div>
</body>
</html>
