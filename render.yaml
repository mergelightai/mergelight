# The Mergelight token server. Create it once from this file in Render's dashboard (New > Blueprint).
services:
  - type: web
    name: mergelight
    runtime: node
    region: virginia
    plan: starter # A paid size, so it doesn't sleep. On the free plan the first sign-in after a quiet spell waited for it to wake.
    rootDir: packages/token-server
    buildCommand: npm install --include=dev && npm run build --if-present # TypeScript is a dev tool, so it needs --include=dev.
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    domains:
      - api.mergelight.dev
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GITHUB_APP_CLIENT_ID
        value: Iv23liM8BL5MwWeDmXHV
      # The GitHub App's private key. Render asks for it when the Blueprint is created.
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      # For "Sign in with GitHub" on the setup page. It belongs to the Mergelight Setup app, which has no private key.
      - key: GITHUB_SETUP_APP_CLIENT_SECRET
        sync: false
      # For signing in to the dashboard. It belongs to the Mergelight AI app, the one that posts reviews.
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
