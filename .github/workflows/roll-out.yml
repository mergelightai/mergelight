# Moves the major tag people follow, like v0, to the newest release that is a day old. The wait
# is there so a bad release can be pulled before it reaches anyone on @v0.
#
# To roll out sooner: run this by hand with "now" ticked.
# To pull a bad release: mark it as a pre-release, or delete it. The tag goes back to the latest good
# release on the next run. Run this by hand to do that right away. Pull it also when a fixed release
# is already out: the tag takes the newest release that is a day old, and that can be the bad one.
#
# The tag moves with the "Mergelight Release" GitHub App, not the workflow's own token. GitHub never
# lets the workflow's token point a tag at a commit whose workflow files differ, by git or by the API,
# and most releases change one (tested Nov 12 2026: v0 stayed on v0.1.4 for that reason). The app has
# Contents and Workflows write on this repository only. Its id is the variable RELEASE_APP_ID and its
# private key the secret RELEASE_APP_PRIVATE_KEY. The app is also the only one the tag ruleset lets
# move v0, so nobody else can, not even an admin's token.
name: Roll out

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      now:
        description: Don't wait for the release to be a day old
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release

jobs:
  roll-out:
    runs-on: ubuntu-latest
    steps:
      - name: Get the release app's token
        id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          # The push at the end uses this token.
          token: ${{ steps.app.outputs.token || github.token }}
      - name: Move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
          NOW: ${{ inputs.now }}
        run: |
          # Every release people can get: not a draft, not a pre-release. Newest version first, by its
          # number and not by when it was published, so a release made again later doesn't count as new.
          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select((.draft or .prerelease) | not) | {tag: .tag_name, at: .published_at, age: (now - (.published_at | fromdate) | floor)}] | sort_by(.tag | ltrimstr("v") | split(".") | map(tonumber? // 0)) | reverse')"
          newest="$(jq -r '.[0].tag // empty' <<<"$releases")"
          if [ -z "$newest" ]; then echo "There is no release yet."; exit 0; fi
          major="${newest%%.*}"
          list="$(jq --arg major "$major" '[.[] | select(.tag | startswith($major + "."))]' <<<"$releases")"
          # The newest of them that is a day old. Not only the newest release: when a new one comes out
          # every day, the newest is never a day old, and the tag would never move.
          min=86400
          if [ "$NOW" = "true" ]; then min=0; fi
          read -r tag age < <(jq -r --argjson min "$min" '[.[] | select(.age >= $min)][0] // empty | "\(.tag) \(.age)"' <<<"$list") || true
          if [ -z "$tag" ]; then echo "No $major release is a day old yet. $newest is $(jq -r '.[0].age' <<<"$list") seconds old."; exit 0; fi
          target="$(git rev-parse "$tag^{commit}")"
          current="$(git rev-parse -q --verify "refs/tags/$major^{commit}" || true)"
          if [ "$current" = "$target" ]; then echo "$major is already on $tag."; exit 0; fi
          # Never back: a release someone rolled out by hand ("now") stays until a newer one is a day old.
          # A pulled release (a pre-release, or deleted) isn't in the list, so the tag moves off it.
          for newer in $(jq -r '.[].tag' <<<"$list"); do
            [ "$newer" = "$tag" ] && break
            if [ "$(git rev-parse -q --verify "refs/tags/$newer^{commit}" || true)" = "$current" ]; then
              echo "$major is on $newer, which is newer than $tag and still a release. It stays."
              exit 0
            fi
          done
          git tag -f "$major" "$target"
          if ! git push -f origin "refs/tags/$major"; then
            echo "::error::GitHub refused to move $major to $tag. If the error above names a workflow file, the release app is missing: set RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY (see the top of this file)."
            exit 1
          fi
          echo "$major moved to $tag ($age seconds old)."
