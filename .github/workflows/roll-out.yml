# Moves the major tag people follow, like v0, to the newest release whose canary passed.
#
# The canary: after each release, canary.yml opens a pull request in the sandbox repository that runs
# the review with the new release on one planted, obvious bug. It passed when that review finished
# and found something. So a release that can't review, or that misses the bug, never reaches @v0, and
# this run turns red to say so. The logic is in .github/scripts/roll-out.mjs.
#
# To roll out without the canary: run this by hand with "now" ticked.
# To pull a bad release: mark it as a pre-release, or delete it. The tag goes back to the newest
# release whose canary passed on the next run. Run this by hand to do that right away.
#
# The tag moves with the "Mergelight Release" GitHub App, not the workflow's own token. GitHub never
# lets the workflow's token point a tag at a commit whose workflow files differ, by git or by the API,
# and most releases change one (tested Nov 12 2026: v0 stayed on v0.1.4 for that reason). The app is
# installed on this repository and the sandbox only. Its id is the variable RELEASE_APP_ID and its
# private key the secret RELEASE_APP_PRIVATE_KEY. It is also the only one the tag ruleset lets move
# v0, so nobody else can, not even an admin's token.
name: Roll out

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      now:
        description: Roll out the newest release without waiting for its canary
        type: boolean
        default: false

permissions:
  contents: write # Only used without the release app, by a run with "now".

concurrency:
  group: release

jobs:
  roll-out:
    runs-on: ubuntu-latest
    steps:
      - name: Get the release app's token
        id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2, pinned: it gets the release app's key
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: mergelightai
          repositories: mergelight,action-sandbox
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: read
          permission-checks: read
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          # The push at the end uses this token.
          token: ${{ steps.app.outputs.token || github.token }}
      - name: Pick the release
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          SANDBOX_TOKEN: ${{ steps.app.outputs.token }}
          NOW: ${{ inputs.now }}
        run: node .github/scripts/roll-out.mjs
      - name: Move the major tag
        if: steps.pick.outputs.tag != ''
        env:
          MAJOR: ${{ steps.pick.outputs.major }}
          TAG: ${{ steps.pick.outputs.tag }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          git tag -f "$MAJOR" "$SHA"
          if ! git push -f origin "refs/tags/$MAJOR"; then
            echo "::error::GitHub refused to move $MAJOR to $TAG. If the error above names a workflow file, the release app is missing: set RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY (see the top of this file)."
            exit 1
          fi
          echo "$MAJOR moved to $TAG."
      - name: Say which canaries failed
        if: steps.pick.outputs.failed != ''
        env:
          FAILED: ${{ steps.pick.outputs.failed }}
        run: |
          echo "::error::The canary failed for $FAILED, so @v0 doesn't get it. Look at the canary pull request in mergelightai/action-sandbox, then pull the release (mark it as a pre-release) or run the canary again."
          exit 1
