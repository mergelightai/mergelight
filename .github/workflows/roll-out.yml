# Moves the major tag people follow, like v0, to the newest release whose canary passed.
#
# The canary: after each release, canary.yml opens a pull request in the sandbox repository that runs
# the review with the new release on one planted, obvious bug. It passed when that review finished
# and found something. So a release that can't review, or that misses the bug, never reaches @v0, and
# this run turns red to say so. The logic is in .github/scripts/roll-out.mjs.
#
# To roll out without the canary: run this by hand with "now" ticked. It still needs the release app.
# To pull a bad release: mark it as a pre-release, or delete it. The tag goes back to the newest
# release whose canary passed on the next run. Run this by hand to do that right away.
#
# The tag moves with the "Mergelight Release" GitHub App, not the workflow's own token. GitHub never
# lets the workflow's token point a tag at a commit whose workflow files differ, by git or by the API,
# and most releases change one (tested Nov 12 2026: v0 stayed on v0.1.4 for that reason). The app is
# installed on this repository and the sandbox only. Its id is the repository variable RELEASE_APP_ID,
# and its private key the secret RELEASE_APP_PRIVATE_KEY of the environment "release", which only main
# can use. It is also the only one the tag ruleset lets move v0, so nobody else can, not even an admin.
name: Roll out

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      now:
        description: Roll out the newest release without waiting for its canary
        type: boolean
        default: false

permissions:
  contents: read # The tag moves with the release app's token, the only one the tag lock lets through.

# Its own queue: sharing release.yml's would let an hourly run replace a release waiting in line.
concurrency:
  group: roll-out

jobs:
  roll-out:
    runs-on: ubuntu-latest
    # The release app's key is a secret of this environment, which only main can use. So a workflow on
    # any other branch can't read the key and move v0 past the tag lock.
    environment: release
    steps:
      - name: Get the release app's token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2, pinned: it gets the release app's key
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: mergelightai
          repositories: mergelight,action-sandbox
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: read
          permission-checks: read
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, pinned: it gets the release app's token
        with:
          fetch-depth: 0
          fetch-tags: true
          # The push at the end uses this token.
          token: ${{ steps.app.outputs.token }}
      - name: Pick the release
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          SANDBOX_TOKEN: ${{ steps.app.outputs.token }}
          NOW: ${{ inputs.now }}
        run: node .github/scripts/roll-out.mjs
      - name: Move the major tag
        if: steps.pick.outputs.tag != ''
        env:
          MAJOR: ${{ steps.pick.outputs.major }}
          TAG: ${{ steps.pick.outputs.tag }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          # Only a commit on main, so a release someone made from another branch can't reach @v0.
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$TAG ($SHA) isn't on main, so $MAJOR stays where it is."
            exit 1
          fi
          # And only the commit that released that version, so a made-up release tag on an old commit can't.
          version="$(git show "$SHA:packages/mergelight/package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG points at a commit whose version is $version, so $MAJOR stays where it is."
            exit 1
          fi
          git tag -f "$MAJOR" "$SHA"
          if ! git push -f origin "refs/tags/$MAJOR"; then
            echo "::error::GitHub refused to move $MAJOR to $TAG. Only the release app may move it: check that RELEASE_APP_ID, the environment secret RELEASE_APP_PRIVATE_KEY and the tag ruleset are as the top of this file says."
            exit 1
          fi
          echo "$MAJOR moved to $TAG."
      # These run even when an earlier one failed, so every problem is reported in the same run.
      - name: Say that v0 is on a release whose canary failed
        if: ${{ !cancelled() && steps.pick.outputs.current_failed != '' }}
        env:
          MAJOR: ${{ steps.pick.outputs.major }}
          TAG: ${{ steps.pick.outputs.current_failed }}
        run: |
          echo "::error::$MAJOR is on $TAG, and its canary failed (the reason is above). Pull $TAG (mark it as a pre-release), and the next run moves $MAJOR off it."
          exit 1
      - name: Say that v0 is on a release no canary checked
        if: ${{ !cancelled() && steps.pick.outputs.current_missing != '' }}
        env:
          MAJOR: ${{ steps.pick.outputs.major }}
          TAG: ${{ steps.pick.outputs.current_missing }}
        run: |
          echo "::error::$MAJOR is on $TAG, which no canary has checked. Run the Canary workflow for $TAG (Actions, Canary, tag $TAG)."
          exit 1
      - name: Say which canaries didn't pass
        if: ${{ !cancelled() && steps.pick.outputs.failed != '' }}
        env:
          FAILED: ${{ steps.pick.outputs.failed }}
        run: |
          echo "::error::The canary failed for $FAILED, so @v0 doesn't get it (the reason is above). Look at the canary pull request in mergelightai/action-sandbox, then run the Canary workflow again, or pull the release (mark it as a pre-release) if it is broken."
          exit 1
      - name: Say which releases have no canary
        if: ${{ !cancelled() && steps.pick.outputs.missing != '' }}
        env:
          MISSING: ${{ steps.pick.outputs.missing }}
        run: |
          echo "::error::No canary was opened for $MISSING, so @v0 doesn't get it yet. Run the Canary workflow for it (Actions, Canary, tag $MISSING)."
          exit 1
