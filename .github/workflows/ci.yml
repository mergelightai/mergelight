# Runs every test on every pull request, and before each release (release.yml calls this).
name: Tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The server's tests need a real Postgres: its row rules are what keeps one org out of another's data.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # GitHub reads action.yml only when a workflow uses the action, so a broken one fails in customers'
      # runs, never in this repository's. A real YAML parser reads it here first, with the workflows.
      - name: action.yml and the workflows are valid YAML
        run: ruby -ryaml -e 'ARGV.each { |f| YAML.load_file(f) }' action.yml .github/workflows/*.yml packages/mergelight/templates/*.yml examples/*.yml
      - name: Package tests
        working-directory: packages/mergelight
        run: npm ci --no-audit --no-fund && npm test
      - name: Token server tests
        working-directory: packages/token-server
        run: npm ci --no-audit --no-fund && npm test
      # After the package tests: one of these runs the built CLI against the server.
      - name: Server tests
        working-directory: packages/server
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm ci --no-audit --no-fund && npm test
      - name: Build the site
        working-directory: site
        run: npm ci --no-audit --no-fund && npm run build
      - name: Browser tests
        working-directory: site
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:browser
