# Releases whatever version packages/mergelight/package.json says, when that changes on main.
# To release: bump the version in a pull request and merge it. Then canary.yml opens a canary pull
# request in the sandbox, and people on @v0 get the release once that review passed, when
# roll-out.yml moves the tag.
#
# A bad release the canary missed: mark it as a pre-release on GitHub, also when a fixed release is
# already out. roll-out.yml takes the newest release whose canary passed, and that can be the bad one.
name: Release

on:
  push:
    branches: [main]
    paths:
      - packages/mergelight/package.json
  workflow_dispatch:

permissions:
  contents: write
  actions: write # Turns the roll-out schedule back on, in case GitHub paused it during a quiet spell.

concurrency:
  group: release

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Publish the release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./packages/mergelight/package.json').version")"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released."
            # A run done again by hand, for example after its canary failed to open, still opens the canary.
            # A push that changed package.json without a new version doesn't.
            if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "tag=$tag" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          notes="To pin to this release instead of following \`@v0\`, use this line in your workflows:

          \`\`\`yaml
          - uses: mergelightai/mergelight@$GITHUB_SHA # $tag
          \`\`\`"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes --notes "$notes"
          gh workflow enable roll-out.yml
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Tests the new release with a real review in the sandbox, before it can reach @v0.
  canary:
    needs: release
    # Without the release app, canary.yml fails loudly, which is what should happen.
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/canary.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
