# Releases whatever version packages/mergelight/package.json says, when that changes on main.
# To release: bump the version in a pull request and merge it. People on @v0 get it a day later,
# when roll-out.yml moves the tag.
name: Release

on:
  push:
    branches: [main]
    paths:
      - packages/mergelight/package.json
  workflow_dispatch:

permissions:
  contents: write
  actions: write # Turns the roll-out schedule back on, in case GitHub paused it during a quiet spell.

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./packages/mergelight/package.json').version")"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released."
            exit 0
          fi
          notes="To pin to this release instead of following \`@v0\`, use this line in your workflows:

          \`\`\`yaml
          - uses: mergelightai/mergelight@$GITHUB_SHA # $tag
          \`\`\`"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes --notes "$notes"
          gh workflow enable roll-out.yml
