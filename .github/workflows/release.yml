# Releases whatever version packages/mergelight/package.json says, when that changes on main.
# To release: bump the version in a pull request and merge it.
name: Release

on:
  push:
    branches: [main]
    paths:
      - packages/mergelight/package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./packages/mergelight/package.json').version")"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          # The major tag moves, for people who choose automatic updates over a pinned commit.
          major="${tag%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
