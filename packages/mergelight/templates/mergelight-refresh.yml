# Refreshes the Codex login when it has under 5 days left and saves it at once, so reviews rarely need to.
# Scheduled jobs only run from the default branch. Only does anything with a ChatGPT login.
name: Mergelight login refresh

on:
  schedule:
    - cron: "17 4 */3 * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Lets the app save the refreshed login.

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: mergelight-refresh-login
    steps:
      # Not pinned, on purpose. mergelight.yml explains why. If you pin one, pin them all.
      - uses: mergelightai/mergelight@v0
        with:
          codex-auth-json: ${{ secrets.CODEX_AUTH_JSON }}
