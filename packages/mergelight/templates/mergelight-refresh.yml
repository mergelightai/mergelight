# Uses the Codex login every third day, so it stays fresh and two reviews at once don't both refresh it,
# which can invalidate it. Scheduled jobs only run from the default branch. Only does anything with a ChatGPT login.
name: Mergelight login refresh

on:
  schedule:
    - cron: "17 4 */3 * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Lets the app save the refreshed login.

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: mergelight-refresh-login
    steps:
      - uses: mergelightai/mergelight@v0
        with:
          codex-auth-json: ${{ secrets.CODEX_AUTH_JSON }}
